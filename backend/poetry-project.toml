[tool.poetry]
name = "adaptive-sat-backend"
version = "0.1.0"
description = "Adaptive SAT Learning Platform Backend"
authors = ["Adaptive SAT Team <info@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = {extras = ["email"], version = "^2.6.4"}
pydantic-settings = "^2.2.1"
sqlalchemy = "^2.0.28"
# Pinned directly (not left to sqlalchemy's own marker-gated extra): that
# marker lists platform_machine "aarch64" for ARM but not macOS's "arm64",
# so `poetry install` silently skips it on Apple Silicon. SQLAlchemy's async
# engine needs it for run_sync() bridging (e.g. Alembic's async env.py),
# which crashes with "the greenlet library is required" on first migration
# run otherwise -- masked under Docker (Linux reports "aarch64"), not on a
# bare-metal `poetry run uvicorn` on an M-series Mac.
greenlet = "^3.0"
asyncpg = "^0.29.0"
alembic = "^1.13.1"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "4.0.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
python-multipart = "^0.0.9"
psycopg2-binary = "^2.9.12"
resend = "^2.35.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
black = "^24.2.0"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]
